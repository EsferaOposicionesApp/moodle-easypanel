# Apache para Moodle 5.x dentro del contenedor.
#
# Lo importante de este fichero: la raíz web es public/, y todo lo que hay por
# encima queda inaccesible. En Moodle 5.x el código y la configuración viven
# fuera de public/ precisamente para eso.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # El resto del árbol (config.php, vendor, docker...) no se sirve nunca.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    # Easypanel entrega HTTP al contenedor y termina el TLS por delante. Con
    # esto Apache y Moodle saben que la petición original era https.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Cabeceras que no cuestan nada y evitan disgustos.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
