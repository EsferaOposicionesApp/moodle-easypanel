; Ajustes de PHP que Moodle 5.2 exige o agradece.

; Moodle lo comprueba al instalar y se niega a seguir por debajo de 5000:
; un formulario de ajustes de curso manda muchos más campos de los que la
; gente imagina.
max_input_vars = 5000

memory_limit = 512M
max_execution_time = 300

; Subidas: una copia de seguridad de curso con vídeos se va a cientos de MB.
upload_max_filesize = 512M
post_max_size = 512M

date.timezone = Europe/Madrid

; El código no cambia dentro del contenedor, así que se puede ser agresivo:
; cada despliegue construye una imagen nueva.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Nada de exponer la versión de PHP en las cabeceras.
expose_php = Off
